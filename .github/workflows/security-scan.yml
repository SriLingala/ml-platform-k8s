name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,helm
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload SARIF
        if: ${{ hashFiles('checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

  kubescape:
    name: Kubescape Kubernetes Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan Kubernetes manifests
        uses: kubescape/github-action@main
        continue-on-error: true   # informational — findings visible in logs, not a hard block
        with:
          files: "platform/namespaces/**/*.yaml,rbac/**/*.yaml,gitops/**/*.yaml"
          frameworks: NSA,MITRE
          severityThreshold: high
