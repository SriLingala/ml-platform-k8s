# MLflow — experiment tracking + model registry
# Chart: community-charts/mlflow or bitnami/mlflow
# https://github.com/bitnami/charts/tree/main/bitnami/mlflow

image:
  tag: "2.11.0"

replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Backend store — PostgreSQL (use Azure Database for PostgreSQL Flexible Server in prod)
backendStore:
  databaseMigration: true
  postgres:
    enabled: true
    host: ""           # set via --set or external secret
    port: 5432
    database: mlflow
    user: mlflow
    password: ""       # injected via External Secrets from Key Vault

# Artefact store — Azure Blob Storage via Workload Identity
artifactRoot: "wasbs://mlflow-artifacts@<storage-account>.blob.core.windows.net/"

serviceAccount:
  create: true
  annotations:
    # Workload Identity binding — no credentials in pods
    azure.workload.identity/client-id: ""   # set per environment

podLabels:
  azure.workload.identity/use: "true"

# Pin to CPU nodes — MLflow server doesn't need GPU
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload-type
              operator: NotIn
              values:
                - ml-training
                - ml-serving

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: mlflow-basic-auth
  hosts:
    - host: mlflow.internal.example.com
      paths:
        - path: /
          pathType: Prefix

# Prometheus metrics scraping
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: ml-monitoring
