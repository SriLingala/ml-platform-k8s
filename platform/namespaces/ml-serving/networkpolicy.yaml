# NetworkPolicies for ml-serving namespace
# Inference pods are externally reachable (via Gateway API) — tighter egress controls than training.

# ── 1. Default deny all ───────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ── 2. Allow DNS ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── 3. Allow ingress from Gateway API (Envoy Gateway) ────────────────────────
# External inference requests arrive via Envoy Gateway in the gateway-system namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: ml-serving
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: ""   # all InferenceService pods
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
---
# ── 4. Allow egress to Azure Blob (model pull by KServe storage initialiser) ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-azure-blob
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
---
# ── 5. Allow KServe controller → inference pods ───────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kserve-controller
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kserve
      ports:
        - port: 8080
          protocol: TCP
---
# ── 6. Allow Prometheus scraping ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-monitoring
      ports:
        - port: 9090
          protocol: TCP
        - port: 8080
          protocol: TCP
---
# ── 7. Deny egress to cluster metadata endpoint ───────────────────────────────
# Explicitly block access to Azure IMDS — serving pods have no reason to query it
# (Workload Identity handles token exchange transparently via webhook)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-metadata-server
  namespace: ml-serving
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # Azure IMDS — blocked at network layer
